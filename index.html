<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>課程</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181C">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2312181C'/%3E%3Cg fill='none' stroke='%23E8E4DA' stroke-width='7' stroke-linecap='round'%3E%3Cpath d='M52 48v84'/%3E%3Cpath d='M74 44v88'/%3E%3Cpath d='M96 50v82'/%3E%3C/g%3E%3Cpath d='M118 46l22 6-14 82-22-6z' fill='none' stroke='%23C4783C' stroke-width='7' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#12181C;
    --paper:#E8E4DA;
    --dim:#8A9299;
    --rule:#242D33;
    --shifu:#C4566A;
    --xuemi:#D0783C;
    --sat:#4C86C6;
    --seeds:#6FA24A;
    --pressplay:#9B7FD4;
    --wujiamake:#D9A441;
    --lanceman:#4FA39B;
    --starart:#C9A227;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--ink);color:var(--paper);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Helvetica Neue",sans-serif;
    padding:max(28px,env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    max-width:640px;margin:0 auto;
    min-height:100vh;
  }

  header{margin-bottom:26px;}
  h1{
    font-size:27px;font-weight:700;margin:0 0 5px;
    letter-spacing:.06em;
  }
  header p{margin:0;font-size:12.5px;color:var(--dim);letter-spacing:.02em;}

  .shelf{display:flex;flex-direction:column;gap:9px;}

  a.spine{
    display:flex;align-items:stretch;gap:14px;
    text-decoration:none;color:inherit;
    background:#182025;
    border:1px solid var(--rule);
    border-radius:5px;
    padding:15px 16px 15px 0;
    transition:background .12s ease;
  }
  a.spine:active{background:#1F2A31;}
  a.spine:focus-visible{outline:2px solid var(--paper);outline-offset:2px;}

  .band{width:4px;border-radius:0 3px 3px 0;flex:none;}

  .body{flex:1;min-width:0;}
  .name{display:block;font-size:16.5px;font-weight:600;letter-spacing:.02em;}
  .note{
    display:block;font-size:12.5px;color:var(--dim);margin-top:4px;
    line-height:1.5;
    white-space:pre-wrap;word-break:break-word;
  }
  .note:empty::before{content:"點右側鉛筆寫下上次上到哪";opacity:.42;}

  .pencil{
    flex:none;align-self:center;
    width:38px;height:38px;margin-right:2px;
    display:grid;place-items:center;
    border:1px solid var(--rule);border-radius:5px;
    background:none;color:var(--dim);
    font-size:15px;cursor:pointer;
  }
  .pencil:active{color:var(--paper);}

  footer{
    margin-top:30px;padding-top:16px;
    border-top:1px solid var(--rule);
    font-size:11.5px;color:var(--dim);line-height:1.7;
  }
  footer b{color:#A8B0B6;font-weight:600;}

  /* ---- 分頁 ---- */
  .tabs{display:flex;margin:-8px 0 22px;border-bottom:1px solid var(--rule);}
  .tabs button{
    flex:none;background:none;border:0;color:var(--dim);
    font:inherit;font-size:14.5px;font-weight:600;letter-spacing:.04em;
    padding:8px 4px 10px;margin-right:18px;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--paper);}
  [hidden]{display:none !important;}

  .sec{font-size:12px;color:var(--dim);letter-spacing:.08em;margin:0 0 10px;font-weight:600;}
  .btn{
    background:none;border:1px solid var(--rule);border-radius:5px;color:var(--paper);
    font:inherit;font-size:13px;padding:7px 11px;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;
  }
  .btn:active{background:#1F2A31;}
  .btn.pri{border-color:#3A474F;background:#212C33;}
  .btn.sm{padding:5px 9px;font-size:12.5px;}
  .btn:disabled{opacity:.35;}

  /* ---- 今天 ---- */
  .today{
    background:#182025;border:1px solid var(--rule);border-radius:5px;
    padding:14px 16px;margin-bottom:22px;
  }
  .today h2{font-size:15px;margin:0 0 10px;font-weight:700;letter-spacing:.03em;}
  .today .empty{font-size:13px;color:var(--dim);line-height:1.6;}
  .trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule);}
  .trow:first-of-type{border-top:0;padding-top:0;}
  .trow .tm{font-size:12px;color:var(--dim);width:44px;flex:none;line-height:1.35;}
  .trow .t{flex:1;min-width:0;font-size:14px;border-left:3px solid;padding-left:9px;}
  .trow .t small{display:block;color:var(--dim);font-size:12px;margin-top:2px;}
  .trow.done .t{opacity:.55;}

  /* ---- 週課表 ---- */
  .wkbar{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .wkbar .rng{flex:1;text-align:center;font-size:14.5px;font-weight:600;letter-spacing:.03em;}
  .wk{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));gap:3px;}
  .wk .hd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--dim);padding:2px 0 6px;}
  .wk .hd b{display:block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;font-size:14px;color:var(--paper);font-weight:600;}
  .wk .hd.now{color:var(--paper);}
  .wk .hd.now b{background:var(--paper);color:var(--ink);}
  .wk .rl{font-size:11px;white-space:nowrap;color:var(--dim);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.3;text-align:center;}
  .cell{
    min-height:74px;border-radius:4px;background:#161D22;border:1px solid var(--rule);
    padding:5px 4px;font:inherit;color:var(--paper);text-align:left;cursor:pointer;
    display:flex;flex-direction:column;gap:3px;overflow:hidden;position:relative;
  }
  .cell.na{background:none;border:0;cursor:default;}
  .cell.past{opacity:.45;}
  .cell.is-today{border-color:#56646E;}
  .cell .cn{font-size:11.5px;font-weight:600;line-height:1.3;word-break:break-all;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .cell .pf{font-size:10px;color:var(--dim);line-height:1.2;}
  .cell.has{border-left-width:3px;}
  .cell .ck{position:absolute;right:4px;bottom:3px;font-size:11px;color:#7FB069;}
  .cell .ov{position:absolute;right:4px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--dim);}
  .cell.free .plus{margin:auto;color:#3A474F;font-size:16px;}
  .legend{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.6;}
  .wktools{display:flex;gap:8px;margin-top:14px;}
  .wktools .btn{flex:1;font-size:12.5px;}

  /* ---- 課程清單 ---- */
  .card{
    background:#182025;border:1px solid var(--rule);border-radius:5px;
    display:flex;gap:14px;padding:14px 14px 14px 0;
  }
  .card .bd{flex:1;min-width:0;}
  .card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .card .cn{font-size:16px;font-weight:600;letter-spacing:.02em;}
  .card .pf{font-size:12px;color:var(--dim);}
  .tag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid currentColor;margin-left:auto;white-space:nowrap;}
  .tag.ok{color:#7FB069;} .tag.late{color:#E07A5F;} .tag.over{color:#E05F5F;} .tag.fin,.tag.free{color:var(--dim);}
  .bar{height:5px;background:#0E1316;border-radius:3px;margin:10px 0 7px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:3px;}
  .meta{font-size:12.5px;color:var(--dim);line-height:1.6;}
  .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .plist{display:flex;flex-direction:column;gap:9px;}
  .add{width:100%;margin-top:10px;padding:12px;border-style:dashed;color:var(--dim);}
  .tools{display:flex;gap:8px;margin-top:22px;}
  .tools .btn{flex:1;color:var(--dim);font-size:12.5px;}

  /* ---- 對話框 ---- */
  dialog{
    background:#182025;color:var(--paper);border:1px solid var(--rule);border-radius:8px;
    width:min(520px,calc(100vw - 24px));padding:20px 18px;
  }
  dialog::backdrop{background:rgba(0,0,0,.6);}
  dialog h3{margin:0 0 4px;font-size:17px;letter-spacing:.03em;}
  dialog .subt{font-size:12.5px;color:var(--dim);margin:0 0 16px;}
  .f{margin-bottom:14px;}
  .f label.lb{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.04em;}
  .f input:not([type=radio]),.f select{
    width:100%;background:#0E1316;color:var(--paper);border:1px solid var(--rule);border-radius:5px;
    font:inherit;font-size:16px;padding:9px 10px;
  }
  .f textarea{width:100%;background:#0E1316;color:var(--paper);border:1px solid var(--rule);border-radius:5px;font:inherit;font-size:16px;padding:9px 10px;resize:vertical;}
  .f2{display:flex;gap:10px;} .f2 .f{flex:1;}
  .seg{display:flex;gap:6px;}
  .seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:#0E1316;border:1px solid var(--rule);border-radius:5px;padding:9px 0;font-size:13.5px;cursor:pointer;color:var(--dim);}
  .seg input{accent-color:var(--paper);margin:0;}
  .seg label:has(input:checked){color:var(--paper);border-color:#4A5862;background:#2E3A42;}
  .hint{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.5;}
  .dlg-acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .dlg-acts .del{margin-right:auto;color:#E07A5F;}
  .slotinfo{background:#0E1316;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;margin-bottom:14px;font-size:13px;line-height:1.6;}
  .slotinfo b{font-size:14.5px;}
  .slotinfo .row{display:flex;gap:6px;margin-top:8px;}
  .items{margin-top:12px;border-top:1px solid var(--rule);}
  .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);}
  .it input{width:18px;height:18px;flex:none;accent-color:#7FB069;margin:0;}
  .it .itx{flex:1;min-width:0;font-size:13.5px;line-height:1.4;}
  .it .itx small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;}
  .it.done .itx{opacity:.5;}
</style>
</head>
<body>

<header>
  <h1>課程</h1>
  <p>八個平台，一個入口</p>
</header>

<nav class="tabs" role="tablist">
  <button type="button" role="tab" data-tab="hub" aria-selected="true">入口</button>
  <button type="button" role="tab" data-tab="sched" aria-selected="false">課表</button>
  <button type="button" role="tab" data-tab="courses" aria-selected="false">課程進度</button>
</nav>

<section id="tab-hub">
  <div class="shelf" id="shelf"></div>
</section>

<section id="tab-sched" hidden>
  <div class="today" id="today"></div>
  <div class="wkbar">
    <button type="button" class="btn sm" id="prevWk" aria-label="上一週">‹</button>
    <div class="rng" id="wkRange"></div>
    <button type="button" class="btn sm" id="nextWk" aria-label="下一週">›</button>
    <button type="button" class="btn sm" id="thisWk">本週</button>
  </div>
  <div class="wk" id="wk"></div>
  <div class="legend">點格子安排或更換課程。右上角小點＝這週臨時調整過；✓＝那堂有完成單元。</div>
  <div class="wktools">
    <button type="button" class="btn" id="autoBtn">依進度自動排每週課表</button>
  </div>
</section>

<section id="tab-courses" hidden>
  <div class="plist" id="plist"></div>
  <button type="button" class="btn add" id="addBtn">＋ 新增課程</button>
  <div class="tools">
    <button type="button" class="btn" id="exportBtn">備份資料</button>
    <button type="button" class="btn" id="importBtn">還原備份</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</section>

<!-- 通用：輸入／確認／提示（取代瀏覽器的 prompt/confirm/alert，有些環境會擋） -->
<dialog id="ui">
  <form method="dialog" id="uiForm">
    <h3 id="uiTitle"></h3>
    <p class="subt" id="uiMsg"></p>
    <div class="f" id="uiField"><textarea id="uiInput" rows="3"></textarea></div>
    <div class="dlg-acts">
      <span style="margin-right:auto"></span>
      <button type="button" class="btn" id="uiCancel">取消</button>
      <button type="submit" class="btn pri" id="uiOk">確定</button>
    </div>
  </form>
</dialog>

<!-- 課程編輯 -->
<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">新增課程</h3>
    <p class="subt" id="dlgSub">新增後到「課表」把它排進時段。</p>
    <div class="f"><label class="lb" for="fName">課程名稱</label><input id="fName" maxlength="60" placeholder="例：Python 機器學習私塾"></div>
    <div class="f" id="fSiteBox"><label class="lb" for="fSite">平台</label><select id="fSite"></select></div>
    <div class="f2" id="fNumBox">
      <div class="f"><label class="lb" for="fTotal">總單元數</label><input id="fTotal" type="number" inputmode="numeric" min="1"></div>
      <div class="f"><label class="lb" for="fDone">已完成</label><input id="fDone" type="number" inputmode="numeric" min="0" value="0"></div>
    </div>
    <div class="f"><label class="lb" for="fDue">目標完成日（可不填）</label><input id="fDue" type="date">
      <div class="hint">有填就會依課表上排到的堂數，算出每堂要上多少；進度落後會標紅。</div></div>
    <div class="dlg-acts">
      <button type="button" class="btn del" id="delBtn">刪除</button>
      <button type="button" class="btn" id="cancelBtn">取消</button>
      <button type="submit" class="btn pri">儲存</button>
    </div>
  </form>
</dialog>

<!-- 時段 -->
<dialog id="sdlg">
  <form method="dialog" id="sform">
    <h3 id="sTitle"></h3>
    <p class="subt" id="sSub"></p>
    <div id="sInfo"></div>
    <div class="f"><label class="lb" for="sCourse">這個時段上</label><select id="sCourse"></select></div>
    <div class="f">
      <div class="seg">
        <label><input type="radio" name="sScope" value="weekly" checked> 每週固定</label>
        <label><input type="radio" name="sScope" value="once"> 只改這一次</label>
      </div>
      <div class="hint" id="sHint"></div>
    </div>
    <div class="dlg-acts">
      <button type="button" class="btn" id="sCancel">取消</button>
      <button type="submit" class="btn pri">儲存</button>
    </div>
  </form>
</dialog>

<footer>
  備註、課表和進度都存在這支手機的瀏覽器裡，不會上傳，換裝置不會跟著走；要搬家或怕被清掉，用「課程進度」頁下方的備份／還原。<br>
  加到主畫面：<b>Safari</b> 分享鈕 → 加入主畫面；<b>Chrome</b> 選單 → 加到主畫面。
</footer>

<script>
// 要新增或修改平台，改這裡就好，一行一個。
// id 需對應上面 :root 裡的 --<id> 色票。
const SITES = [
  { id:'shifu',     name:'ShiFu 師父',   url:'https://shifu.tw/course/mylessons' },
  { id:'xuemi',     name:'學米',         url:'https://www.xuemi.co/members/e18c70ad-a8fd-4eac-8471-e8a1efa4d857?tabkey=private-tech' },
  { id:'sat',       name:'知識衛星',     url:'https://sat.cool' },
  { id:'seeds',     name:'學籽',         url:'https://seeds.com.tw/my-courses' },
  { id:'pressplay', name:'PressPlay',    url:'https://www.pressplay.cc/member/learning/projects' },
  { id:'wujiamake', name:'吾家手作',     url:'https://wujiamake.com/my-courses' },
  { id:'lanceman',  name:'蘭斯曼形象學院', url:'https://lanceman.com.tw/my-account/courses/' },
  { id:'starart',   name:'星彧國際',     url:'https://star-art.com.tw/online-courses/' },
];


// ================= 通用對話框 =================
// mode: 'prompt' 回傳字串或 null；'confirm' 回傳 true/false；'alert' 回傳 true
function uiDialog(mode, title, msg, value){
  const d = document.getElementById('ui');
  const inp = document.getElementById('uiInput');
  document.getElementById('uiTitle').textContent = title;
  const m = document.getElementById('uiMsg'); m.textContent = msg || ''; m.hidden = !msg;
  document.getElementById('uiField').hidden = mode !== 'prompt';
  document.getElementById('uiCancel').hidden = mode === 'alert';
  inp.value = value || '';
  return new Promise(resolve => {
    let result = mode === 'prompt' ? null : false;
    const ok = e => { e.preventDefault(); result = mode === 'prompt' ? inp.value : true; d.close(); };
    const cancel = () => d.close();
    const form = document.getElementById('uiForm');
    const btn = document.getElementById('uiCancel');
    form.addEventListener('submit', ok);
    btn.addEventListener('click', cancel);
    d.addEventListener('close', function done(){
      form.removeEventListener('submit', ok); btn.removeEventListener('click', cancel);
      d.removeEventListener('close', done);
      resolve(result);
    });
    d.showModal();
    if (mode === 'prompt'){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  });
}
const uiPrompt  = (t, m, v) => uiDialog('prompt', t, m, v);
const uiConfirm = m => uiDialog('confirm', '確認', m);
const uiAlert   = m => uiDialog('alert', '提醒', m);

const KEY = 'courseHub.notes.v1';

function loadNotes(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch(e){ return {}; }
}
function saveNotes(n){
  try { localStorage.setItem(KEY, JSON.stringify(n)); }
  catch(e){ /* 無痕模式會擋，忽略即可，連結照樣能用 */ }
}

const notes = loadNotes();
const shelf = document.getElementById('shelf');

SITES.forEach(site => {
  const a = document.createElement('a');
  a.className = 'spine';
  a.href = site.url;

  const band = document.createElement('span');
  band.className = 'band';
  band.style.background = `var(--${site.id})`;

  const body = document.createElement('span');
  body.className = 'body';

  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = site.name;

  const note = document.createElement('span');
  note.className = 'note';
  note.textContent = notes[site.id] || '';

  body.append(name, note);

  const pencil = document.createElement('button');
  pencil.className = 'pencil';
  pencil.type = 'button';
  pencil.textContent = '✎';
  pencil.setAttribute('aria-label', site.name + ' 的備註');
  pencil.addEventListener('click', async e => {
    e.preventDefault();
    e.stopPropagation();
    const now = notes[site.id] || '';
    const next = await uiPrompt(site.name, '上次上到哪？', now);
    if (next === null) return;
    const v = next.trim();
    if (v) notes[site.id] = v; else delete notes[site.id];
    saveNotes(notes);
    note.textContent = v;
  });

  a.append(band, body, pencil);
  shelf.appendChild(a);
});
// ================= 時段設定 =================
// 要改上課時間改這裡。row 0/1/2 = 上午/下午/晚上；min = 這堂有幾分鐘可以上課。
const ROWS = [
  { name:'上午', start:'09:00', end:'12:00', min:180 },
  { name:'下午', start:'14:00', end:'17:00', min:180 },
  { name:'晚上', start:'19:00', end:'21:00', min:120 },
];
// 每個星期幾開放哪些時段（0=日 … 6=六）
const AVAIL = { 0:[0,1,2], 1:[2], 2:[2], 3:[2], 4:[2], 5:[2], 6:[0,1,2] };
// 自動排課時填格子的順序（週一 → 週日）
const SLOT_ORDER = ['1-2','2-2','3-2','4-2','5-2','6-0','6-1','6-2','0-0','0-1','0-2'];
// 手動新增的課沒有時長，自動排課時每單元先估 30 分鐘
const MIN_PER_UNIT = 30;

// ================= 從平台同步來的課程資料 =================

  try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch(e){ return fb; }
}
function saveJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

let plan = loadJSON(PLAN_KEY, []); if (!Array.isArray(plan)) plan = [];
let sched = loadJSON(SCHED_KEY, {});
sched.template = sched.template || {}; // '週幾-row' → courseId
sched.over = sched.over || {};         // 'YYYY-MM-DD#row' → courseId 或 ''（臨時調整）
sched.log = sched.log || {};           // 'YYYY-MM-DD#row' → 那堂完成的量
const savePlan = () => saveJSON(PLAN_KEY, plan);
const saveSched = () => saveJSON(SCHED_KEY, sched);
const courseById = id => plan.find(c => c.id === id);

// 把同步資料併進來：新的整組加入；已有的以平台最新進度為準（保留你設的期限與課表）
(function applySeed(){
  if (!SEED || loadJSON(SEED_KEY, '') === SEED.v) return;
  SEED.tracks.forEach(t => {
    let c = courseById(t.id);
    if (!c){
      c = { id:t.id, type:'track', site:t.site || SEED.site, name:t.name, due:'', hist:{} };
      plan.push(c);
    }
    // 你在這裡勾過的進度不會被平台快照蓋掉：每個單元取剩餘較少的那個
    const old = {}; (c.items || []).forEach(x => old[x.id] = x);
    c.type = 'track'; c.site = t.site || SEED.site; c.note = t.note; c.url = t.url || ''; c.manual = !!t.manual;
    // 平台有標到期日、而你還沒自己設目標日 → 以到期日當期限
    if (t.due && !c.due){
      const d = new Date(); c.due = t.due; c.start = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      c.startDone = t.items.reduce((s,x) => s + x.m - x.r, 0);
    }
    c.items = t.items.map(x => { const o = old[x.id]; return (o && o.r < x.r) ? { ...x, r:o.r, d:o.r <= 0 ? x.l : Math.max(o.d, x.d) } : { ...x }; });
    c.synced = SEED.v;
  });
  savePlan(); saveJSON(SEED_KEY, SEED.v);
})();

// ================= 日期工具（一律本地時間） =================
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);
const md = s => { const d = parse(s); const y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '/' : ''; return `${y}${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const mondayOf = s => { const d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); };
const hhmm = t => t.replace(/^0/, '');
const hm = m => { m = Math.round(m); const h = Math.floor(m/60), r = m % 60; return h ? (r ? `${h} 小時 ${r} 分` : `${h} 小時`) : `${r} 分`; };
const isTrack = c => c.type === 'track';
const qty = (c, n) => isTrack(c) ? hm(n) : `${n} 單元`;

// 某天某時段實際排的課
function slotCourse(date, row){
  const dk = `${date}#${row}`;
  const id = (dk in sched.over) ? sched.over[dk] : (sched.template[`${parse(date).getDay()}-${row}`] || '');
  return id && courseById(id) ? id : '';
}

// 從今天(含)到目標日(含)，課表上排給這門課的堂數與分鐘
function sessionsLeft(c, today){
  if (!c.due) return null;
  const n = daysBetween(today, c.due);
  let count = 0, mins = 0;
  for (let i = 0; i <= n; i++){
    const d = addDays(today, i);
    for (const r of AVAIL[parse(d).getDay()]) if (slotCourse(d, r) === c.id){ count++; mins += ROWS[r].min; }
  }
  return { count, mins };
}
const weeklySlots = c => Object.keys(sched.template).filter(k => sched.template[k] === c.id)
  .sort((a,b) => SLOT_ORDER.indexOf(a) - SLOT_ORDER.indexOf(b));
const slotLabel = k => { const [w,r] = k.split('-').map(Number); return WD[w] + ROWS[r].name.slice(0,1); };

// 課程組的下一批單元：湊滿 minutes 分鐘為止
function nextItems(c, minutes){
  const out = []; let acc = 0;
  for (const it of c.items){
    if (it.r <= 0) continue;
    out.push(it); acc += it.r;
    if (acc >= minutes) break;
  }
  return out;
}
const itemUrl = (c, it) => c.url || `https://www.xuemi.co/programs/${it.id}/contents`;
const courseUrl = c => {
  if (isTrack(c)){ const n = c.items.find(x => x.r > 0); return n ? itemUrl(c, n) : siteById(c.site).url; }
  return siteById(c.site).url;
};

function analyze(c){
  const today = todayStr();
  let total, done;
  if (isTrack(c)){
    total = Math.max(1, c.items.reduce((s,x) => s + x.m, 0));
    done = total - c.items.reduce((s,x) => s + x.r, 0);
  } else {
    total = Math.max(1, c.total|0);
    done = Math.min(total, Math.max(0, c.done|0));
  }
  const remain = total - done;
  const doneToday = (c.hist && c.hist[today]) || 0;
  const r = { total, done, remain, pct: Math.floor(done/total*100), doneToday, perSession: null };
  if (isTrack(c)){
    r.items = c.items.length;
    r.itemsDone = c.items.filter(x => x.r <= 0).length;
    r.lessons = c.items.reduce((s,x) => s + x.l, 0);
    r.lessonsDone = c.items.reduce((s,x) => s + x.d, 0);
  }

  if (remain <= 0){ r.status = 'fin'; r.label = '已完成'; return r; }
  if (!c.due){ r.status = 'free'; r.label = '未設期限'; return r; }

  const left = daysBetween(today, c.due);
  r.daysLeft = left;
  if (left < 0){ r.status = 'over'; r.label = `逾期 ${-left} 天`; return r; }

  // 從設定期限那天到目標日，線性分配；expected 是「到今天開始前」應完成的量
  const start = c.start || today;
  const span = Math.max(1, daysBetween(start, c.due));
  const elapsed = Math.min(span, Math.max(0, daysBetween(start, today)));
  const startDone = Math.min(total, c.startDone|0);
  const expected = Math.floor(startDone + (total - startDone) * elapsed / span);
  const late = done < expected;
  r.status = late ? 'late' : 'ok';
  r.label = late ? `落後 ${qty(c, expected - done)}` : '進度正常';

  const s = sessionsLeft(c, today);
  r.sessions = s.count; r.sessionMins = s.mins;
  if (s.count > 0) r.perSession = Math.ceil((remain + doneToday) / s.count);
  if (isTrack(c) && s.mins < remain && r.status === 'ok'){ r.status = 'late'; r.label = '排的時間不夠'; }
  return r;
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const color = c => `var(--${c.site})`;

// 課程組：把下一個未完成單元標成上完
function finishNext(c, slotKey){
  const it = c.items.find(x => x.r > 0); if (!it) return;
  setItemDone(c, it, true, slotKey);
}
function setItemDone(c, it, done, slotKey){
  const t = todayStr();
  c.hist = c.hist || {};
  if (done){
    const gained = it.r;
    it.r = 0; it.d = it.l;
    c.hist[t] = (c.hist[t] || 0) + gained;
    if (slotKey){ sched.log[slotKey] = (sched.log[slotKey] || 0) + 1; saveSched(); }
  } else {
    it.r = it.m; it.d = 0;
  }
  savePlan(); renderPlan();
}

// ================= 今天 =================
function renderToday(){
  const box = document.getElementById('today');
  box.replaceChildren();
  const today = todayStr();
  const wd = parse(today).getDay();
  box.append(el('h2', null, `今天 · ${md(today)}`));

  if (!plan.length){
    box.append(el('div','empty','還沒有課程。先到「課程進度」新增課程，再回來把它排進下面的課表。'));
    return;
  }
  const rows = AVAIL[wd].map(r => ({ r, id: slotCourse(today, r) })).filter(x => x.id);
  if (!rows.length){
    let next = null;
    for (let i = 1; i <= 14 && !next; i++){
      const d = addDays(today, i);
      for (const r of AVAIL[parse(d).getDay()]){
        const id = slotCourse(d, r);
        if (id){ next = `下一堂：${md(d)}${ROWS[r].name} ${courseById(id).name}`; break; }
      }
    }
    const open = AVAIL[wd].map(r => ROWS[r].name + ' ' + hhmm(ROWS[r].start) + '–' + hhmm(ROWS[r].end)).join('、');
    box.append(el('div','empty', `今天沒排課（可上時段：${open}）。` + (next || '點下方課表的格子開始排課。')));
    return;
  }
  rows.forEach(({r, id}) => {
    const c = courseById(id), a = analyze(c);
    const dk = `${today}#${r}`;
    const got = sched.log[dk] || 0;
    const row = el('div', 'trow');
    const tm = el('div','tm'); tm.append(ROWS[r].name, document.createElement('br'), hhmm(ROWS[r].start));
    const t = el('div','t', c.name); t.style.borderColor = color(c);
    let sub;
    if (a.status === 'fin') sub = '這組已上完，可改排別的課';
    else if (isTrack(c)){
      const its = nextItems(c, ROWS[r].min);
      sub = '這堂上：' + its.map(x => `${x.t}（${hm(x.r)}）`).join('、');
      if (got) sub = `已上完 ${got} 個單元 ✓　接著：` + its.map(x => x.t).join('、');
    } else {
      const goal = a.perSession || 1;
      sub = `這堂 ${got}/${goal} 單元${got >= goal ? ' ✓' : ''}`;
      if (got >= goal) row.classList.add('done');
    }
    if (a.status === 'late' || a.status === 'over') sub += ` · ${a.label}`;
    t.append(el('small', null, sub));
    const go = el('a','btn sm','前往'); go.href = courseUrl(c); go.target = '_blank'; go.rel = 'noopener';
    const plus = el('button','btn sm pri', isTrack(c) ? '上完一單元' : '+1'); plus.type = 'button';
    plus.disabled = a.status === 'fin';
    plus.addEventListener('click', () => isTrack(c) ? finishNext(c, dk) : bump(c.id, 1, dk));
    row.append(tm, t, go, plus);
    box.append(row);
  });
}

// ================= 週課表 =================
let weekStart = mondayOf(todayStr());
function renderWeek(){
  const grid = document.getElementById('wk');
  grid.replaceChildren();
  const today = todayStr();
  const end = addDays(weekStart, 6);
  const ds = parse(weekStart), de = parse(end);
  document.getElementById('wkRange').textContent =
    `${ds.getMonth()+1}/${ds.getDate()} – ${de.getMonth()+1}/${de.getDate()}`;
  document.getElementById('thisWk').disabled = weekStart === mondayOf(today);

  grid.append(el('div'));
  const dates = [...Array(7)].map((_, i) => addDays(weekStart, i));
  dates.forEach(d => {
    const h = el('div', 'hd' + (d === today ? ' now' : ''));
    h.append(WD[parse(d).getDay()], el('b', null, String(parse(d).getDate())));
    grid.append(h);
  });

  ROWS.forEach((R, r) => {
    const rl = el('div','rl'); rl.append(R.name, document.createElement('br'), hhmm(R.start).replace(':00','') + '–' + hhmm(R.end).replace(':00',''));
    grid.append(rl);
    dates.forEach(d => {
      const wd = parse(d).getDay();
      if (!AVAIL[wd].includes(r)){ grid.append(el('div','cell na')); return; }
      const dk = `${d}#${r}`;
      const id = slotCourse(d, r);
      const b = el('button','cell'); b.type = 'button';
      if (d < today) b.classList.add('past');
      if (d === today) b.classList.add('is-today');
      if (id){
        const c = courseById(id);
        b.classList.add('has'); b.style.borderLeftColor = color(c);
        b.append(el('span','cn', c.name.replace(/^學米/, '').replace(/（.*）$/, '')), el('span','pf', siteById(c.site).name));
        b.setAttribute('aria-label', `${md(d)}${R.name} ${c.name}`);
      } else {
        b.classList.add('free'); b.append(el('span','plus','+'));
        b.setAttribute('aria-label', `${md(d)}${R.name} 空堂`);
      }
      if (dk in sched.over) b.append(el('span','ov'));
      if (sched.log[dk]) b.append(el('span','ck','✓'));
      b.addEventListener('click', () => openSlot(d, r));
      grid.append(b);
    });
  });
}
document.getElementById('prevWk').addEventListener('click', () => { weekStart = addDays(weekStart, -7); renderWeek(); });
document.getElementById('nextWk').addEventListener('click', () => { weekStart = addDays(weekStart, 7); renderWeek(); });
document.getElementById('thisWk').addEventListener('click', () => { weekStart = mondayOf(todayStr()); renderWeek(); });

const openLists = new Set();
function renderItems(c, box){
  c.items.forEach(it => {
    const row = el('div', 'it' + (it.r <= 0 ? ' done' : ''));
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = it.r <= 0;
    cb.setAttribute('aria-label', it.t + ' 已上完');
    cb.addEventListener('change', () => setItemDone(c, it, cb.checked));
    const tx = el('div','itx', it.t);
    const info = it.l === 1 ? (it.r <= 0 ? '已完成' : hm(it.m)) : it.r <= 0 ? `${it.l} 堂 · 已完成`
      : (it.r < it.m ? `${it.l} 堂 · 剩 ${hm(it.r)}／${hm(it.m)}` : `${it.l} 堂 · ${hm(it.m)}`);
    tx.append(el('small', null, info + (it.n && it.r > 0 && it.r < it.m ? ` · 接著：${it.n}` : '')));
    const go = el('a','btn sm','開啟'); go.href = itemUrl(c, it); go.target = '_blank'; go.rel = 'noopener';
    row.append(cb, tx, go);
    box.append(row);
  });
}

function renderList(){
  const box = document.getElementById('plist');
  box.replaceChildren();
  const order = {over:0,late:1,ok:2,free:3,fin:4};
  plan.map(c => ({ c, a: analyze(c) }))
    .sort((x,y) => order[x.a.status] - order[y.a.status] || (x.c.due||'9999').localeCompare(y.c.due||'9999'))
    .forEach(({c,a}) => {
      const site = siteById(c.site);
      const card = el('div','card');
      const band = el('span','band'); band.style.background = color(c);
      const bd = el('div','bd');
      const top = el('div','top');
      top.append(el('span','cn', c.name), el('span','pf', site.name), el('span', 'tag ' + a.status, a.label));
      const bar = el('div','bar'); const fill = el('i');
      fill.style.width = a.pct + '%'; fill.style.background = color(c); bar.append(fill);

      const lines = [];
      if (isTrack(c)){
        lines.push(a.lessons === a.items ? `${a.itemsDone}/${a.items} 支影片（${a.pct}%）` : `${a.itemsDone}/${a.items} 個單元、${a.lessonsDone}/${a.lessons} 堂（${a.pct}%）`);
        lines.push(`內容共 ${hm(a.total)}，還剩 ${hm(a.remain)}`);
        if (c.note) lines.push(c.note);
      } else {
        lines.push(`${a.done} / ${a.total} 單元（${a.pct}%）`);
      }
      const ws = weeklySlots(c);
      if (ws.length){
        const wmin = ws.reduce((s,k) => s + ROWS[+k.split('-')[1]].min, 0);
        let l = `每週 ${ws.length} 堂（${hm(wmin)}）：${ws.map(slotLabel).join('、')}`;
        if (isTrack(c) && a.remain > 0) l += ` · 照這樣約 ${Math.ceil(a.remain / wmin)} 週上完`;
        lines.push(l);
      } else lines.push('還沒排進課表');
      if (c.due && a.status !== 'fin'){
        if (a.status === 'over') lines.push(`目標 ${md(c.due)} 已過，還剩 ${qty(c, a.remain)}`);
        else {
          lines.push(`目標 ${md(c.due)}，還有 ${a.daysLeft} 天`);
          if (!a.sessions) lines.push('到期前課表沒排到這門，請排課');
          else if (isTrack(c)) lines.push(`到期前排了 ${a.sessions} 堂（${hm(a.sessionMins)}），內容剩 ${hm(a.remain)}`);
          else lines.push(`到期前排了 ${a.sessions} 堂，每堂約 ${a.perSession} 單元`);
        }
      }
      if (c.synced) lines.push(c.manual ? `清單抄自平台：${c.synced.slice(0,10)}` : `進度同步自平台：${c.synced.slice(0,10)}`);
      const meta = el('div','meta');
      lines.forEach((l,i) => { if (i) meta.append(document.createElement('br')); meta.append(l); });

      const acts = el('div','acts');
      const go = el('a','btn sm','前往上課'); go.href = courseUrl(c); go.target = '_blank'; go.rel = 'noopener';
      acts.append(go);
      if (isTrack(c)){
        const nx = el('button','btn sm pri','上完一單元'); nx.type = 'button'; nx.disabled = a.status === 'fin';
        nx.addEventListener('click', () => finishNext(c));
        const tg = el('button','btn sm', openLists.has(c.id) ? '收起清單' : `單元清單（${a.items}）`); tg.type = 'button';
        tg.addEventListener('click', () => { openLists.has(c.id) ? openLists.delete(c.id) : openLists.add(c.id); renderList(); });
        acts.append(nx, tg);
      } else {
        const minus = el('button','btn sm','−1'); minus.type = 'button';
        minus.addEventListener('click', () => bump(c.id, -1));
        const plus = el('button','btn sm pri','完成 +1'); plus.type = 'button';
        plus.addEventListener('click', () => bump(c.id, 1));
        acts.append(minus, plus);
      }
      const edit = el('button','btn sm','編輯'); edit.type = 'button';
      edit.addEventListener('click', () => openDlg(c.id));
      acts.append(edit);

      bd.append(top, bar, meta, acts);
      if (isTrack(c) && openLists.has(c.id)){
        const lb = el('div','items'); renderItems(c, lb); bd.append(lb);
      }
      card.append(band, bd);
      box.append(card);
    });
}

function renderPlan(){ renderToday(); renderWeek(); renderList(); }

// 手動課程：完成/退回單元；從某一堂按的會記在那一堂
function bump(id, delta, slotKey){
  const c = courseById(id); if (!c || isTrack(c)) return;
  const total = Math.max(1, c.total|0);
  const next = Math.min(total, Math.max(0, (c.done|0) + delta));
  if (next === (c.done|0)) return;
  c.done = next;
  const t = todayStr();
  c.hist = c.hist || {};
  c.hist[t] = Math.max(0, (c.hist[t] || 0) + delta);
  if (!c.hist[t]) delete c.hist[t];
  if (slotKey){
    sched.log[slotKey] = Math.max(0, (sched.log[slotKey] || 0) + delta);
    if (!sched.log[slotKey]) delete sched.log[slotKey];
    saveSched();
  }
  savePlan(); renderPlan();
}

let slotCtx = null;

  const { date, row } = slotCtx;
  const box = $('sInfo'); box.replaceChildren();
  const id = slotCourse(date, row);
  if (!id) return;
  const c = courseById(id), a = analyze(c);
  const dk = `${date}#${row}`;
  const info = el('div','slotinfo');
  info.append(el('b', null, c.name), document.createElement('br'),
    `${siteById(c.site).name} · ${a.pct}% · ${a.label}`);
  if (isTrack(c) && a.status !== 'fin'){
    info.append(document.createElement('br'), '這堂建議：' + nextItems(c, ROWS[row].min).map(x => `${x.t}（${hm(x.r)}）`).join('、'));
  }
  if (sched.log[dk]) info.append(document.createElement('br'), `這堂完成了 ${sched.log[dk]} 個單元`);

  const plus = el('button','btn sm pri', isTrack(c) ? '上完一單元' : '這堂完成 +1'); plus.type = 'button';
  plus.disabled = date > todayStr() || a.status === 'fin';
  plus.addEventListener('click', () => { isTrack(c) ? finishNext(c, dk) : bump(c.id, 1, dk); fillSlotInfo(); });

}
function openSlot(date, row){
  slotCtx = { date, row };
  const wd = parse(date).getDay();
  $('sTitle').textContent = `${md(date)} ${ROWS[row].name}`;
  $('sSub').textContent = `${hhmm(ROWS[row].start)}–${hhmm(ROWS[row].end)}（${hm(ROWS[row].min)}）`;
  const cur = slotCourse(date, row);
  const sel = $('sCourse'); sel.replaceChildren();
  const none = el('option', null, '（空堂）'); none.value = ''; sel.append(none);
  plan.filter(c => analyze(c).status !== 'fin' || c.id === cur).forEach(c => {
    const o = el('option', null, `${c.name}（${siteById(c.site).name}）`); o.value = c.id; sel.append(o);
  });
  sel.value = cur;
  const overridden = `${date}#${row}` in sched.over;
  document.querySelector(`input[name=sScope][value=${overridden ? 'once' : 'weekly'}]`).checked = true;
  $('sHint').textContent = `每週固定：之後每個週${WD[wd]}${ROWS[row].name}都排這門（個別調整過的週次不受影響）。`;
  fillSlotInfo();
  openD($('sdlg'));
}
$('sCancel').addEventListener('click', () => closeD($('sdlg')));
$('sform').addEventListener('submit', e => {
  e.preventDefault();
  const { date, row } = slotCtx;
  const val = $('sCourse').value;
  const dk = `${date}#${row}`, tk = `${parse(date).getDay()}-${row}`;
  const scope = document.querySelector('input[name=sScope]:checked').value;
  if (scope === 'weekly'){
    if (val) sched.template[tk] = val; else delete sched.template[tk];
    delete sched.over[dk];
  } else {
    if (val === (sched.template[tk] || '')) delete sched.over[dk]; else sched.over[dk] = val;
  }
  saveSched(); closeD($('sdlg')); renderPlan();
});

// ================= 自動排課 =================
$('autoBtn').addEventListener('click', async () => {
  const today = todayStr();
  const list = plan.map(c => ({ c, a: analyze(c) })).filter(x => x.a.status !== 'fin');
  if (!list.length){ uiAlert('沒有未完成的課程可排。先到「課程進度」新增課程。'); return; }
  if (Object.keys(sched.template).length &&
      !(await uiConfirm('會重排「每週固定」課表（只改這一次的調整不受影響）。繼續？'))) return;

  // 每門課每週需要的時間：剩餘分鐘 ÷ 剩餘週數（沒設期限當 2 年，排在有期限的課後面）
  list.forEach(x => {
    const mins = isTrack(x.c) ? x.a.remain : x.a.remain * MIN_PER_UNIT;
    const weeks = x.c.due ? Math.max(1, (daysBetween(today, x.c.due) + 1) / 7) : 104;
    x.need = mins / weeks; x.mins = mins;
  });
  const order = {over:0,late:1,ok:2,free:3};
  list.sort((p,q) => order[p.a.status] - order[q.a.status] || q.need - p.need);
  const pick = list.slice(0, SLOT_ORDER.length);
  const N = SLOT_ORDER.length, sum = pick.reduce((s,x) => s + x.need, 0);
  pick.forEach(x => {
    x.cap = Math.max(1, Math.ceil(x.mins / 120)); // 不必排超過內容所需的堂數
    x.raw = N * x.need / sum; x.n = Math.min(x.cap, Math.max(1, Math.floor(x.raw)));
  });
  let used = pick.reduce((s,x) => s + x.n, 0);
  while (used > N){ const m = pick.reduce((p,q) => q.n > p.n ? q : p); m.n--; used--; }
  pick.slice().sort((p,q) => (q.raw - Math.floor(q.raw)) - (p.raw - Math.floor(p.raw)))
    .forEach(x => { if (used < N && x.n < x.cap){ x.n++; used++; } });
  // 還有空堂就依需求比例繼續補
  while (used < N){
    const c = pick.filter(x => x.n < x.cap).sort((p,q) => q.raw / (q.n||1) - p.raw / (p.n||1))[0];
    if (!c) break; c.n++; used++;
  }
  const left = pick.map(x => ({ id: x.c.id, k: x.n }));
  const seq = []; let prev = null;
  for (let i = 0; i < used; i++){
    const cand = left.filter(x => x.k > 0).sort((p,q) => q.k - p.k);
    const ch = cand.find(x => x.id !== prev) || cand[0];
    seq.push(ch.id); ch.k--; prev = ch.id;
  }
  sched.template = {};
  seq.forEach((id, i) => sched.template[SLOT_ORDER[i]] = id);
  saveSched(); renderPlan();
});

// ================= 課程編輯 =================
const dlg = $('dlg');
const fSite = $('fSite');
SITES.forEach(s => { const o = el('option', null, s.name); o.value = s.id; fSite.append(o); });
let editing = null;
function openDlg(id){
  editing = id || null;
  const c = courseById(id) || { name:'', site:SITES[0].id, total:'', done:0, due:'' };
  const tr = isTrack(c);
  $('dlgTitle').textContent = id ? '編輯課程' : '新增課程';
  $('fName').value = c.name; fSite.value = c.site;
  $('fTotal').value = c.total || ''; $('fDone').value = c.done || 0;
  $('fDue').value = c.due || '';
  $('fSiteBox').hidden = tr; $('fNumBox').hidden = tr;
  $('dlgSub').textContent = tr ? '這組課的單元和進度由平台同步，這裡只改名稱和目標日。' : '新增後到「課表」把它排進時段。';
  $('delBtn').hidden = !id;
  openD(dlg);
}
$('addBtn').addEventListener('click', () => openDlg(null));
$('cancelBtn').addEventListener('click', () => closeD(dlg));
$('delBtn').addEventListener('click', async () => {
  const c = courseById(editing);
  if (!c || !(await uiConfirm(`刪除「${c.name}」？課表上排的這門課也會清掉。`))) return;
  plan = plan.filter(x => x.id !== editing);
  for (const k in sched.template) if (sched.template[k] === editing) delete sched.template[k];
  for (const k in sched.over) if (sched.over[k] === editing) delete sched.over[k];
  savePlan(); saveSched(); closeD(dlg); renderPlan();
});
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('fName').value.trim();
  const due = $('fDue').value || '';
  let c = courseById(editing);
  if (c && isTrack(c)){
    if (!name){ uiAlert('請填名稱'); return; }
    const a = analyze(c);
    if (!c.start || c.due !== due){ c.start = todayStr(); c.startDone = a.done; }
    c.name = name; c.due = due;
    savePlan(); closeD(dlg); renderPlan(); return;
  }
  const total = parseInt($('fTotal').value, 10);
  if (!name || !(total > 0)){ uiAlert('請填課程名稱和總單元數'); return; }
  const done = Math.min(total, Math.max(0, parseInt($('fDone').value, 10) || 0));
  if (!c){ c = { id: 'c' + Date.now().toString(36), hist:{} }; plan.push(c); }
  if (!c.start || c.due !== due){ c.start = todayStr(); c.startDone = done; } // 期限變了就從今天重新起算
  Object.assign(c, { name, site: fSite.value, total, done, due });
  delete c.days; // 舊版欄位
  savePlan(); closeD(dlg); renderPlan();
});

// ================= 備份 / 還原 =================
$('exportBtn').addEventListener('click', () => {
  const data = { app:'courseHub', v:3, exported: new Date().toISOString(), notes: loadNotes(), plan, sched, seed: loadJSON(SEED_KEY, '') };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `課程備份-${todayStr()}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'courseHub' || !Array.isArray(data.plan)) throw 0;
    if (!(await uiConfirm(`用這份備份（${data.plan.length} 門課）覆蓋目前的課表、課程和備註？`))) return;
    saveJSON(PLAN_KEY, data.plan);
    saveJSON(SCHED_KEY, data.sched || {});
    if (data.seed) saveJSON(SEED_KEY, data.seed);
    saveNotes(data.notes || {});
    location.reload();
  } catch(err){ uiAlert('這不是課程備份檔'); }
});

// 從背景切回來（可能跨過午夜）時重算
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderPlan(); });

let startTab = 'hub';
try { startTab = localStorage.getItem(TAB_KEY) || 'hub'; } catch(e){}
if (startTab === 'plan') startTab = 'sched';
showTab(['hub','sched','courses'].includes(startTab) ? startTab : 'hub');
</script>
